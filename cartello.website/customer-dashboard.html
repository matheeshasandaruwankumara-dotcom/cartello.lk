<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Account - Cartello</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#f5f7fb;
    color:#222;
}

/* HEADER */
header{
    background:#111;
    color:white;
    padding:14px 25px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    flex-wrap:wrap;
}

.logo{
    height:48px;
    cursor:pointer;
}

.header-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.header-buttons button{
    border:none;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.shop-btn{
    background:#fff;
    color:#111;
}

.refresh-btn{
    background:#2196f3;
    color:#fff;
}

.logout-btn{
    background:#e53935;
    color:#fff;
}

/* CONTAINER */
.container{
    max-width:1100px;
    margin:30px auto;
    padding:0 15px;
}

.page-title{
    margin-bottom:25px;
}

.page-title h1{
    font-size:30px;
    margin-bottom:5px;
}

.page-title p{
    color:#666;
}

/* CUSTOMER CARD */
.customer-card{
    background:white;
    border-radius:14px;
    padding:22px;
    margin-bottom:25px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.customer-card h2{
    margin-bottom:18px;
}

.customer-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.info-box{
    background:#f7f8fa;
    padding:14px;
    border-radius:9px;
}

.info-label{
    font-size:12px;
    color:#777;
    margin-bottom:5px;
}

.info-value{
    font-weight:bold;
    word-break:break-word;
}

/* ORDERS */
.orders-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
    gap:10px;
}

.orders-title h2{
    font-size:24px;
}

.orders-count{
    background:#111;
    color:#fff;
    padding:6px 12px;
    border-radius:20px;
    font-size:13px;
}

/* ORDER CARD */
.order-card{
    background:#fff;
    border-radius:14px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.order-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
    border-bottom:1px solid #eee;
    padding-bottom:15px;
    margin-bottom:15px;
}

.order-id{
    font-size:19px;
    font-weight:bold;
}

.order-date{
    color:#777;
    font-size:13px;
    margin-top:5px;
}

.status{
    padding:7px 13px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    white-space:nowrap;
}

.status-pending{
    background:#fff3cd;
    color:#856404;
}

.status-approved{
    background:#d4edda;
    color:#155724;
}

.status-rejected{
    background:#f8d7da;
    color:#721c24;
}

.status-processing{
    background:#dbeafe;
    color:#1e40af;
}

.status-delivered{
    background:#d1fae5;
    color:#065f46;
}

.status-default{
    background:#eee;
    color:#444;
}

/* ITEMS */
.items{
    margin-bottom:18px;
}

.items h3{
    font-size:16px;
    margin-bottom:10px;
}

.item-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#f8f9fb;
    padding:10px 12px;
    border-radius:8px;
    margin-bottom:7px;
    gap:10px;
}

.item-name{
    font-weight:bold;
}

.item-details{
    color:#666;
    font-size:13px;
}

/* TOTAL */
.order-summary{
    border-top:1px solid #eee;
    padding-top:15px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    padding:5px 0;
    color:#555;
}

.summary-row.total{
    font-size:20px;
    font-weight:bold;
    color:#111;
    border-top:1px solid #ddd;
    margin-top:8px;
    padding-top:12px;
}

/* PAYMENT */
.payment-box{
    margin-top:18px;
    background:#f7f8fa;
    padding:14px;
    border-radius:10px;
}

.payment-box strong{
    display:block;
    margin-bottom:5px;
}

.payment-details{
    color:#666;
    font-size:14px;
    word-break:break-word;
}

/* ACTIONS */
.order-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:18px;
}

.order-actions button,
.order-actions a{
    border:none;
    text-decoration:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
}

.check-btn{
    background:#2196f3;
    color:white;
}

.slip-btn{
    background:#6c63ff;
    color:white;
}

.empty{
    background:white;
    text-align:center;
    padding:45px 20px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.empty-icon{
    font-size:50px;
    margin-bottom:15px;
}

.empty h3{
    margin-bottom:8px;
}

.empty p{
    color:#777;
    margin-bottom:20px;
}

.continue-btn{
    background:#111;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

/* LOADING */
.loading{
    background:white;
    padding:35px;
    text-align:center;
    border-radius:14px;
}

.spinner{
    width:35px;
    height:35px;
    border:4px solid #ddd;
    border-top:4px solid #111;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:0 auto 15px;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

/* ERROR */
.error-box{
    background:#fff0f0;
    color:#b00020;
    padding:18px;
    border-radius:10px;
    margin-bottom:20px;
    display:none;
}

/* FOOTER */
footer{
    text-align:center;
    padding:30px 15px;
    color:#777;
    margin-top:30px;
}

/* MOBILE */
@media(max-width:700px){

    header{
        padding:12px 15px;
    }

    .logo{
        height:42px;
    }

    .header-buttons{
        width:100%;
    }

    .header-buttons button{
        flex:1;
    }

    .customer-grid{
        grid-template-columns:1fr;
    }

    .order-top{
        flex-direction:column;
    }

    .order-card{
        padding:17px;
    }

    .item-row{
        flex-direction:column;
        align-items:flex-start;
    }

    .summary-row.total{
        font-size:18px;
    }
}
</style>
</head>

<body>

<header>

    <img
        src="cartello-logo.png"
        class="logo"
        onclick="goHome()"
        alt="Cartello"
    >

    <div class="header-buttons">

        <button class="shop-btn" onclick="goHome()">
            🛍️ Shop
        </button>

        <button class="refresh-btn" onclick="loadOrders()">
            🔄 Refresh
        </button>

        <button class="logout-btn" onclick="logout()">
            🚪 Logout
        </button>

    </div>

</header>


<div class="container">

    <div class="page-title">
        <h1>👤 My Account</h1>
        <p>View your customer details and order history.</p>
    </div>


    <div id="errorBox" class="error-box"></div>


    <!-- CUSTOMER DETAILS -->

    <div class="customer-card">

        <h2>Customer Details</h2>

        <div class="customer-grid">

            <div class="info-box">
                <div class="info-label">Name</div>
                <div class="info-value" id="customerName">-</div>
            </div>

            <div class="info-box">
                <div class="info-label">Username</div>
                <div class="info-value" id="customerUsername">-</div>
            </div>

            <div class="info-box">
                <div class="info-label">Phone</div>
                <div class="info-value" id="customerPhone">-</div>
            </div>

            <div class="info-box">
                <div class="info-label">Customer ID</div>
                <div class="info-value" id="customerId">-</div>
            </div>

        </div>

    </div>


    <!-- ORDERS -->

    <div class="orders-title">

        <h2>📦 My Orders</h2>

        <div class="orders-count" id="ordersCount">
            0 Orders
        </div>

    </div>


    <div id="ordersContainer">

        <div class="loading">

            <div class="spinner"></div>

            <p>Loading your orders...</p>

        </div>

    </div>

</div>


<footer>
    © 2026 Cartello. All Rights Reserved.
</footer>


<script>

/* ==============================
   CARTELLO API
============================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbzcKrEkPzSjuIzYhHgy3RAeJis_2Xzkz2qLyDH13A0Aty_KpISkYG96yc8NbydKuo2qkQ/exec";


/* ==============================
   LOGIN CHECK
============================== */

function checkLogin(){

    const loggedIn =
        localStorage.getItem("cartelloLoggedIn");

    const userType =
        localStorage.getItem("cartelloUserType");

    if(
        loggedIn !== "true" ||
        userType !== "customer"
    ){

        alert("Please login to view your account.");

        window.location.href = "index.html";

        return false;
    }

    return true;
}


/* ==============================
   GET CUSTOMER
============================== */

function getCustomer(){

    try{

        const customer =
            JSON.parse(
                localStorage.getItem("cartelloCurrentCustomer")
            );

        return customer || null;

    }catch(error){

        return null;
    }
}


/* ==============================
   ESCAPE HTML
============================== */

function escapeHTML(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* ==============================
   SHOW CUSTOMER
============================== */

function showCustomer(customer){

    document.getElementById("customerName").textContent =
        customer.name || "-";

    document.getElementById("customerUsername").textContent =
        customer.username || "-";

    document.getElementById("customerPhone").textContent =
        customer.phone || "-";

    document.getElementById("customerId").textContent =
        customer.customerId || "-";
}


/* ==============================
   LOAD ORDERS
============================== */

async function loadOrders(){

    const customer = getCustomer();

    if(!customer){

        showError(
            "Customer information not found. Please login again."
        );

        return;
    }

    showCustomer(customer);

    const container =
        document.getElementById("ordersContainer");

    container.innerHTML = `
        <div class="loading">
            <div class="spinner"></div>
            <p>Loading your orders...</p>
        </div>
    `;

    hideError();


    try{

        const params = new URLSearchParams();

        params.append(
            "action",
            "getCustomerOrders"
        );


        if(customer.customerId){

            params.append(
                "customerId",
                customer.customerId
            );
        }


        if(customer.username){

            params.append(
                "customerUsername",
                customer.username
            );
        }


        if(customer.email){

            params.append(
                "email",
                customer.email
            );
        }


        if(customer.phone){

            params.append(
                "phone",
                customer.phone
            );
        }


        const response =
            await fetch(
                API_URL + "?" + params.toString()
            );


        const data =
            await response.json();


        if(
            !data ||
            data.success !== true
        ){

            throw new Error(
                data && data.message
                    ? data.message
                    : "Unable to load orders."
            );
        }


        const orders =
            Array.isArray(data.orders)
                ? data.orders
                : [];


        /* Save order history locally */

        localStorage.setItem(
            "cartelloCustomerOrders",
            JSON.stringify(orders)
        );


        renderOrders(orders);

    }catch(error){

        console.error(error);

        showError(
            "Orders load කරන්න බැරි වුණා. Internet connection එක සහ Apps Script deployment එක check කරන්න."
        );


        /*
           If online loading fails,
           try previously saved orders.
        */

        try{

            const saved =
                JSON.parse(
                    localStorage.getItem(
                        "cartelloCustomerOrders"
                    )
                );


            if(
                Array.isArray(saved) &&
                saved.length > 0
            ){

                renderOrders(saved);

            }else{

                container.innerHTML = `
                    <div class="empty">

                        <div class="empty-icon">
                            ⚠️
                        </div>

                        <h3>Unable to load orders</h3>

                        <p>
                            Please check your internet connection
                            and try again.
                        </p>

                        <button
                            class="continue-btn"
                            onclick="loadOrders()"
                        >
                            🔄 Try Again
                        </button>

                    </div>
                `;
            }

        }catch(e){

            container.innerHTML = `
                <div class="empty">

                    <div class="empty-icon">
                        ⚠️
                    </div>

                    <h3>Unable to load orders</h3>

                    <button
                        class="continue-btn"
                        onclick="loadOrders()"
                    >
                        🔄 Try Again
                    </button>

                </div>
            `;
        }

    }

}


/* ==============================
   RENDER ORDERS
============================== */

function renderOrders(orders){

    const container =
        document.getElementById("ordersContainer");

    const count =
        document.getElementById("ordersCount");


    count.textContent =
        orders.length +
        (orders.length === 1 ? " Order" : " Orders");


    if(!orders.length){

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📦
                </div>

                <h3>No Orders Yet</h3>

                <p>
                    You haven't placed any orders yet.
                </p>

                <button
                    class="continue-btn"
                    onclick="goHome()"
                >
                    🛍️ Continue Shopping
                </button>

            </div>

        `;

        return;
    }


    /*
       Newest order first
    */

    orders.sort(function(a,b){

        const dateA =
            new Date(a.date || 0).getTime();

        const dateB =
            new Date(b.date || 0).getTime();

        return dateB - dateA;

    });


    let html = "";


    orders.forEach(function(order){

        html += createOrderCard(order);

    });


    container.innerHTML = html;
}


/* ==============================
   CREATE ORDER CARD
============================== */

function createOrderCard(order){

    const orderId =
        order.orderId ||
        order.id ||
        "-";


    const status =
        order.status ||
        "Pending";


    const statusClass =
        getStatusClass(status);


    const date =
        formatDate(order.date);


    const subtotal =
        Number(order.subtotal || 0);


    const delivery =
        Number(order.delivery || 0);


    const total =
        Number(
            order.total ||
            subtotal + delivery
        );


    let itemsHTML = "";


    let items = [];


    try{

        if(Array.isArray(order.items)){

            items = order.items;

        }else if(typeof order.items === "string"){

            items = JSON.parse(order.items);

        }

    }catch(error){

        items = [];
    }


    if(items.length){

        items.forEach(function(item){

            const product =
                item.product ||
                item.name ||
                "Product";


            const medium =
                item.medium ||
                "";


            const quantity =
                Number(item.quantity || 1);


            const price =
                Number(item.price || 0);


            itemsHTML += `

                <div class="item-row">

                    <div>

                        <div class="item-name">
                            ${escapeHTML(product)}
                        </div>

                        <div class="item-details">
                            ${escapeHTML(medium)}
                            ${medium ? " • " : ""}
                            Qty: ${quantity}
                        </div>

                    </div>

                    <strong>
                        Rs. ${formatMoney(price * quantity)}
                    </strong>

                </div>

            `;
        });

    }else{

        itemsHTML = `

            <div class="item-row">

                <div class="item-name">
                    ${escapeHTML(order.product || "Order")}
                </div>

                <div class="item-details">
                    Qty: ${Number(order.quantity || 1)}
                </div>

            </div>

        `;
    }


    let paymentDetails =
        order.paymentDetails ||
        order.payment ||
        "Payment details submitted";


    let slipButton = "";


    if(order.paymentSlipUrl){

        slipButton = `

            <a
                class="slip-btn"
                href="${escapeAttribute(order.paymentSlipUrl)}"
                target="_blank"
                rel="noopener"
            >
                🧾 View Payment Slip
            </a>

        `;
    }


    return `

        <div class="order-card">

            <div class="order-top">

                <div>

                    <div class="order-id">
                        Order #${escapeHTML(orderId)}
                    </div>

                    <div class="order-date">
                        📅 ${escapeHTML(date)}
                    </div>

                </div>


                <div class="status ${statusClass}">
                    ${escapeHTML(status)}
                </div>

            </div>


            <div class="items">

                <h3>
                    🛒 Order Items
                </h3>

                ${itemsHTML}

            </div>


            <div class="order-summary">

                <div class="summary-row">

                    <span>
                        Subtotal
                    </span>

                    <span>
                        Rs. ${formatMoney(subtotal)}
                    </span>

                </div>


                <div class="summary-row">

                    <span>
                        Delivery
                    </span>

                    <span>
                        Rs. ${formatMoney(delivery)}
                    </span>

                </div>


                <div class="summary-row total">

                    <span>
                        Total
                    </span>

                    <span>
                        Rs. ${formatMoney(total)}
                    </span>

                </div>

            </div>


            <div class="payment-box">

                <strong>
                    💳 Payment
                </strong>

                <div class="payment-details">
                    ${escapeHTML(paymentDetails)}
                </div>

            </div>


            <div class="order-actions">

                <button
                    class="check-btn"
                    onclick="checkStatus('${escapeJS(orderId)}')"
                >
                    🔄 Check Payment Status
                </button>

                ${slipButton}

            </div>

        </div>

    `;
}


/* ==============================
   CHECK ORDER STATUS
============================== */

async function checkStatus(orderId){

    if(!orderId){

        alert("Order ID not found.");

        return;
    }


    const buttons =
        document.querySelectorAll(".check-btn");


    buttons.forEach(function(button){

        button.disabled = true;

    });


    try{

        const url =
            API_URL +
            "?action=getOrderStatus&orderId=" +
            encodeURIComponent(orderId);


        const response =
            await fetch(url);


        const data =
            await response.json();


        if(
            !data ||
            data.success !== true
        ){

            throw new Error(
                data && data.message
                    ? data.message
                    : "Status not found."
            );
        }


        const updatedOrder =
            data.order ||
            data;


        /*
           Update saved order history
        */

        try{

            const saved =
                JSON.parse(
                    localStorage.getItem(
                        "cartelloCustomerOrders"
                    )
                ) || [];


            const index =
                saved.findIndex(function(order){

                    return String(
                        order.orderId || order.id
                    ) === String(orderId);

                });


            if(index !== -1){

                saved[index] = {
                    ...saved[index],
                    ...updatedOrder
                };

            }


            localStorage.setItem(
                "cartelloCustomerOrders",
                JSON.stringify(saved)
            );


        }catch(error){

            console.log(
                "Local update skipped"
            );
        }


        /*
           Refresh complete list
        */

        await loadOrders();


        alert(
            "Order " +
            orderId +
            " status: " +
            (updatedOrder.status || "Pending")
        );


    }catch(error){

        console.error(error);

        alert(
            "Payment status check කරන්න බැරි වුණා. Please try again."
        );

    }finally{

        buttons.forEach(function(button){

            button.disabled = false;

        });

    }

}


/* ==============================
   STATUS CLASS
============================== */

function getStatusClass(status){

    const value =
        String(status || "")
            .toLowerCase()
            .trim();


    if(
        value.includes("approved") ||
        value.includes("paid")
    ){

        return "status-approved";

    }


    if(
        value.includes("reject")
    ){

        return "status-rejected";

    }


    if(
        value.includes("process")
    ){

        return "status-processing";

    }


    if(
        value.includes("deliver")
    ){

        return "status-delivered";

    }


    if(
        value.includes("pending")
    ){

        return "status-pending";

    }


    return "status-default";
}


/* ==============================
   DATE FORMAT
============================== */

function formatDate(value){

    if(!value){
        return "-";
    }


    try{

        const date =
            new Date(value);


        if(isNaN(date.getTime())){

            return String(value);

        }


        return date.toLocaleString(
            "en-GB",
            {
                day:"2-digit",
                month:"short",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }catch(error){

        return String(value);

    }

}


/* ==============================
   MONEY
============================== */

function formatMoney(value){

    const number =
        Number(value || 0);


    return number.toLocaleString(
        "en-LK",
        {
            minimumFractionDigits:0,
            maximumFractionDigits:2
        }
    );

}


/* ==============================
   ESCAPE ATTRIBUTE
============================== */

function escapeAttribute(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/"/g,"&quot;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
}


/* ==============================
   ESCAPE JS
============================== */

function escapeJS(value){

    return String(value || "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/"/g,'\\"')
        .replace(/\n/g,"\\n")
        .replace(/\r/g,"\\r");
}


/* ==============================
   ERROR
============================== */

function showError(message){

    const box =
        document.getElementById("errorBox");

    box.textContent = message;

    box.style.display = "block";
}


function hideError(){

    const box =
        document.getElementById("errorBox");

    box.style.display = "none";
}


/* ==============================
   HOME
============================== */

function goHome(){

    window.location.href = "home.html";

}


/* ==============================
   LOGOUT
============================== */

function logout(){

    const confirmLogout =
        confirm(
            "Are you sure you want to logout?"
        );


    if(!confirmLogout){

        return;
    }


    localStorage.removeItem(
        "cartelloLoggedIn"
    );

    localStorage.removeItem(
        "cartelloUserType"
    );

    localStorage.removeItem(
        "cartelloCurrentCustomer"
    );

    window.location.href =
        "index.html";

}

    "DOMContentLoaded",
    function(){

        if(!checkLogin()){

            return;
        }


        const customer =
            getCustomer();


        if(customer){

            showCustomer(customer);

        }


        loadOrders();

    }
);
